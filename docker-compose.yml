services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sunrise-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sunrise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sunrise}
      POSTGRES_DB: ${POSTGRES_DB:-sunrise}
    ports:
      - '5432:5432'
    volumes:
      - sunrise_pg_data:/var/lib/postgresql/data
      - ./apps/api/src/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sunrise} -d ${POSTGRES_DB:-sunrise}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    container_name: sunrise-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-sunrise}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-sunrise-dev-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - sunrise_minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc:RELEASE.2025-02-04T04-57-56Z
    container_name: sunrise-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sunrise}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-sunrise-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-sunrise-artifacts}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
    restart: 'no'

volumes:
  sunrise_pg_data:
  sunrise_minio_data:
